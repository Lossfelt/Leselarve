<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" preserveAspectRatio="none">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6 0.04" numOctaves="3" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="
        0.58 0 0 0 0.28
        0.38 0 0 0 0.15
        0.22 0 0 0 0.06
        0    0 0 0 1"/>
    </filter>
    <linearGradient id="plankShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1aa" stop-opacity="0.6"/>
      <stop offset="0.16" stop-color="#ffe1aa" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd78c" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ffd78c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffd78c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="castShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- cast shadow below plank above (top of this row) -->
  <rect x="0" y="0" width="400" height="14" fill="url(#castShadow)"/>
  <!-- warm LED glow from above plank -->
  <rect x="0" y="0" width="400" height="80" fill="url(#glow)"/>
  <!-- plank base wood texture -->
  <rect x="0" y="260" width="400" height="20" filter="url(#grain)"/>
  <!-- plank 3D shading -->
  <rect x="0" y="260" width="400" height="20" fill="url(#plankShade)"/>
  <!-- bright top edge of plank -->
  <rect x="0" y="260" width="400" height="1.5" fill="#ffe6b8" opacity="0.7"/>
</svg>
